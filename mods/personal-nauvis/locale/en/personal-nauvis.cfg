personal-nauvis-reentry-protection-minutes=Keeps the personal surface peaceful for a short grace period after its owner reconnects, preventing enemies accumulated while offline from dealing immediate damage.
personal-nauvis-max-players=Number of personal planets prepared at startup. Changing it requires a game restart.
personal-nauvis-pvp-grace-minutes=New PvP forces cannot attack or be attacked by existing player forces for this many minutes.

