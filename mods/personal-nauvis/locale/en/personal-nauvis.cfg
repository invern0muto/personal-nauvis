[personal_nauvis]
menu_personal_nauvis=Personal Nauvis
title_personal_nauvis=Personal Nauvis
page_personal_nauvis_text=Personal Nauvis lets friends join an established multiplayer save without spawning inside the host's factory. Each guest receives a newly generated personal Nauvis, chooses Co-op or PvP, and starts with one unique Spidertron.\n\nOnly Nauvis is personal. Space Age destinations remain shared meeting points.
menu_personal_nauvis_modes=Co-op and PvP
title_personal_nauvis_modes=Co-op and PvP
page_personal_nauvis_modes_text=CO-OP\nJoin the host's force and share technologies, recipes, buildings, logistics and force statistics.\n\nPVP\nReceive an independent hostile force. Technologies already completed by the host are copied once; later research and statistics progress independently. A configurable grace period prevents immediate combat.\n\nThe choice is permanent for the current save.
menu_personal_nauvis_worlds=Personal worlds
title_personal_nauvis_worlds=Personal worlds and protection
page_personal_nauvis_worlds_text=Every additional player receives a numbered personal Nauvis with its own spawn. Offline factories are protected from damage, but production and pollution continue.\n\nUse /pn-home to return home. Co-op players may use /pn-visit PLAYER to visit an allied personal world. Enemy worlds cannot be entered with that command.
menu_personal_nauvis_starter=Starter Spidertron
title_personal_nauvis_starter=Starter Spidertron
page_personal_nauvis_starter_text=After choosing a mode, select Accelerated Start, Essential kit, or Spidertron-only. Accelerated Start supplies a larger conventional factory bootstrap without endgame equipment or a rocket silo. The Spidertron includes 100 rockets and is granted only once. If it is destroyed or lost, it will not be replaced.
menu_personal_nauvis_commands=Commands
title_personal_nauvis_commands=Commands
page_personal_nauvis_commands_text=PLAYER COMMANDS\n/pn-home — return to your personal Nauvis\n/pn-visit PLAYER — visit an allied personal world\n/pn-list — list assigned worlds\n\nADMIN COMMANDS\n/pn-send-home PLAYER — return a player home\n/pn-observe PLAYER — invisibly spectate an online player\n/pn-inspect PLAYER — inspect a personal world even while its owner is offline\n/pn-observe-exit — restore the administrator's character\n/pn-set-mode PLAYER coop|pvp — change mode and transfer the personal factory\n/pn-delete-world PLAYER — permanently delete an offline player's world and free its slot
menu_personal_nauvis_server=Public server
title_personal_nauvis_server=Public test server
page_personal_nauvis_server_text=SERVER\nplay.pn.vortexbrain.com:34197\n\nLIVE DASHBOARD\nhttps://pn.vortexbrain.com\n\nThe public server runs current beta builds. Saves and personal worlds may be reset during testing.
